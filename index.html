<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏓 Padel Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0e1a;
  --sidebar:#050810;
  --surface:#0d1221;
  --border:#1e2540;
  --border2:#141929;
  --text:#e8eaf0;
  --text2:#8b92b0;
  --text3:#4b5280;
  --accent:#6366f1;
  --accent2:#818cf8;
  --accent-glow:rgba(99,102,241,.2);
}
html{scrollbar-width:thin;scrollbar-color:#1e2540 var(--bg)}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;font-size:14px}

/* ── SIDEBAR ── */
aside{width:224px;background:var(--sidebar);border-right:1px solid var(--border2);display:flex;flex-direction:column;padding:20px 0;position:fixed;top:0;bottom:0;left:0;z-index:200}
.logo{padding:0 20px 20px;font-size:17px;font-weight:700;color:var(--text);border-bottom:1px solid var(--border2);margin-bottom:12px;display:flex;align-items:center;gap:10px;letter-spacing:.02em}
.logo-icon{width:34px;height:34px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;box-shadow:0 4px 12px rgba(99,102,241,.4)}
.nav-section{padding:16px 20px 6px;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.14em}
nav a{display:flex;align-items:center;gap:11px;padding:9px 20px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;transition:.15s;text-decoration:none;border-left:3px solid transparent}
nav a:hover{color:var(--text);background:rgba(99,102,241,.06)}
nav a.on{color:var(--text);background:rgba(99,102,241,.1);border-left-color:var(--accent)}
nav a .icon{font-size:15px;width:18px;text-align:center;opacity:.8}
.venue-list{display:flex;flex-direction:column;gap:2px;padding:0 12px}
.venue-item{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;transition:.13s}
.venue-item:hover{background:rgba(255,255,255,.04);color:var(--text)}
.venue-item.on{background:rgba(99,102,241,.1);color:var(--text)}
.vdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.venue-count{margin-left:auto;font-size:10px;color:var(--text3);font-family:'Space Mono',monospace}
.sidebar-footer{margin-top:auto;padding:16px 20px;border-top:1px solid var(--border2);font-size:11px;color:var(--text3)}

/* ── MAIN ── */
main{margin-left:224px;flex:1;display:flex;flex-direction:column;min-height:100vh}

/* TOPBAR */
.topbar{background:var(--sidebar);border-bottom:1px solid var(--border2);padding:14px 28px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100}
.page-title{font-size:16px;font-weight:700;color:var(--text);letter-spacing:-.01em}
.topbar-right{margin-left:auto;display:flex;gap:10px;align-items:center}
.search-wrap{position:relative}
.search-wrap .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:13px;pointer-events:none}
input[type=text]{background:var(--surface);border:1.5px solid var(--border);border-radius:8px;color:var(--text);padding:8px 14px 8px 34px;font-size:13px;font-family:'Space Grotesk',sans-serif;outline:none;width:220px;transition:.15s}
input[type=text]:focus{border-color:var(--accent);background:#0f1630}
input[type=text]::placeholder{color:var(--text3)}
select{background:var(--surface);border:1.5px solid var(--border);border-radius:8px;color:var(--text);padding:7px 12px;font-size:13px;font-family:'Space Grotesk',sans-serif;outline:none;cursor:pointer;transition:.15s}
select:focus{border-color:var(--accent)}
.pill{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:transparent;color:var(--text2);transition:.13s;font-family:'Space Grotesk',sans-serif}
.pill:hover,.pill.on{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 0 12px var(--accent-glow)}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:20px 28px 4px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;position:relative;overflow:hidden;transition:.15s}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),#8b5cf6)}
.stat-card .val{font-size:24px;font-weight:700;color:var(--accent2);font-family:'Space Mono',monospace;letter-spacing:-.02em}
.stat-card .lbl{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-top:4px}

/* SECTION HEADER */
.sec{padding:20px 28px 28px}
.sec-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sec-title{font-size:14px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
.sec-count{font-size:11px;color:var(--accent2);font-family:'Space Mono',monospace;font-weight:400;background:var(--accent-glow);padding:2px 8px;border-radius:10px}

/* CONTROLS */
.controls{padding:0 28px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--border2);margin-bottom:0}
.ctrl-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-right:2px}

/* GRID */
.vid-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden;cursor:pointer;transition:all .15s;display:block;position:relative}
.card:hover{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.thumb{position:relative;aspect-ratio:1/1;background:#000;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.card:hover .thumb img{transform:scale(1.06)}
.play-overlay{position:absolute;inset:0;background:rgba(0,0,0,0);display:flex;align-items:center;justify-content:center;transition:.2s}
.card:hover .play-overlay{background:rgba(0,0,0,.35)}
.play-circle{width:38px;height:38px;border-radius:50%;background:rgba(99,102,241,.9);display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.6);transition:.2s;box-shadow:0 0 16px rgba(99,102,241,.6)}
.card:hover .play-circle{opacity:1;transform:scale(1)}
.play-circle svg{width:14px;height:14px;fill:#fff;margin-left:2px}
.dur-badge{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.85);color:#fff;font-size:9px;font-family:'Space Mono',monospace;font-weight:700;padding:1px 5px;border-radius:3px}
.short-tag{position:absolute;top:6px;left:6px;background:#f59e0b;color:#000;font-size:8px;font-weight:700;padding:1px 5px;border-radius:3px;letter-spacing:.04em}
.card-body{padding:7px 8px}
.vtag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:9px;font-weight:600;margin-bottom:4px;letter-spacing:.01em}
.v-desa{background:rgba(139,92,246,.15);color:#a78bfa;border:1px solid rgba(139,92,246,.25)}
.v-378{background:rgba(249,115,22,.15);color:#fb923c;border:1px solid rgba(249,115,22,.25)}
.v-court{background:rgba(34,197,94,.15);color:#4ade80;border:1px solid rgba(34,197,94,.25)}
.v-orange{background:rgba(234,179,8,.15);color:#facc15;border:1px solid rgba(234,179,8,.25)}
.v-raxa{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.25)}
.v-atlas{background:rgba(14,165,233,.15);color:#38bdf8;border:1px solid rgba(14,165,233,.25)}
.v-hive{background:rgba(245,158,11,.15);color:#fbbf24;border:1px solid rgba(245,158,11,.25)}
.v-verde{background:rgba(16,185,129,.15);color:#34d399;border:1px solid rgba(16,185,129,.25)}
.v-other{background:rgba(99,102,241,.1);color:var(--accent2);border:1px solid rgba(99,102,241,.2)}
.card-title{font-size:11px;font-weight:600;color:var(--text);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.card-meta{font-size:11px;color:var(--text2);display:flex;align-items:center;gap:8px}
.card-date{font-family:'Space Mono',monospace;font-size:10px;color:var(--text3)}

/* EMPTY STATE */
.empty{text-align:center;padding:80px 20px;color:var(--text3)}
.empty .emoji{font-size:48px;margin-bottom:16px}
.empty p{font-size:14px}

/* HAMBURGER BUTTON */
.ham-btn{display:none;background:none;border:none;cursor:pointer;padding:6px;color:var(--text);font-size:20px;line-height:1;flex-shrink:0}

/* SIDEBAR OVERLAY */
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:199;opacity:0;transition:opacity .25s}
.sidebar-overlay.open{opacity:1}

/* ── MOBILE ── */
@media(max-width:768px){
  body{display:block}
  /* sidebar: off-canvas */
  aside{transform:translateX(-100%);transition:transform .25s cubic-bezier(.4,0,.2,1);z-index:200;width:260px}
  aside.open{transform:translateX(0)}
  .sidebar-overlay{display:block;pointer-events:none}
  .sidebar-overlay.open{pointer-events:auto}
  /* main full-width */
  main{margin-left:0}
  /* topbar: compact */
  .topbar{padding:11px 16px;gap:10px;flex-wrap:wrap}
  .ham-btn{display:flex;align-items:center;justify-content:center}
  .topbar-right{gap:8px;width:100%;flex-wrap:wrap}
  input[type=text]{width:100%;font-size:14px}
  select{flex:1;min-width:120px;font-size:13px}
  /* stats: 2 cols */
  .stats{grid-template-columns:repeat(2,1fr);gap:10px;padding:14px 16px 4px}
  .stat-card .val{font-size:20px}
  /* controls: scroll horizontal */
  .controls{padding:10px 16px;gap:8px;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}
  .controls::-webkit-scrollbar{display:none}
  /* grid: kotak rapat */
  .vid-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:4px}
  .sec{padding:14px 16px 24px}
  /* timeline mini-grid */
  .sesi-vids{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
}

@media(max-width:480px){
  .vid-grid{grid-template-columns:repeat(3,1fr);gap:3px}
  .stats{grid-template-columns:1fr 1fr}
  .page-title{font-size:14px}
}

/* ── VIDEO MODAL ── */
.modal-wrap{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.88);opacity:0;pointer-events:none;transition:opacity .22s}
.modal-wrap.open{opacity:1;pointer-events:auto}
.modal-box{position:relative;width:min(900px,96vw);max-height:96vh}
.modal-box iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;display:block;background:#000}
.modal-close{position:absolute;top:-40px;right:0;background:none;border:none;color:#fff;font-size:28px;cursor:pointer;line-height:1;opacity:.7;transition:.15s;padding:4px 8px}
.modal-close:hover{opacity:1}
.modal-info{margin-top:12px;color:var(--text2);font-size:13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.modal-title{color:var(--text);font-size:14px;font-weight:600}
.modal-yt{margin-left:auto;color:var(--accent2);font-size:12px;text-decoration:none;border:1px solid var(--border);border-radius:6px;padding:4px 10px;transition:.13s}
.modal-yt:hover{background:var(--accent);border-color:var(--accent);color:#fff}

/* TIMELINE */
.timeline{display:flex;flex-direction:column;gap:20px}
.sesi-block{border:1px solid var(--border);border-radius:12px;overflow:hidden}
.sesi-hdr{background:var(--surface);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:.13s}
.sesi-hdr:hover{background:#111830}
.sesi-hdr-left{display:flex;align-items:center;gap:12px}
.sesi-hdr-date{font-size:14px;font-weight:700;color:var(--accent2);font-family:'Space Mono',monospace}
.sesi-hdr-meta{font-size:11px;color:var(--text3);font-family:'Space Mono',monospace}
.sesi-vids{padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;background:rgba(0,0,0,.2)}
.mini-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;cursor:pointer;text-decoration:none;display:block;transition:.13s}
.mini-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.mini-thumb{position:relative;aspect-ratio:16/9;overflow:hidden;background:#000}
.mini-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.mini-dur{position:absolute;bottom:5px;right:5px;background:rgba(0,0,0,.85);color:#fff;font-size:9px;font-family:'Space Mono',monospace;padding:1px 5px;border-radius:3px}
.mini-body{padding:8px 10px}
.mini-title{font-size:11px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>

  <!-- CONTENT -->

      <div class="sec-title" id="sec-title">Semua Video <span class="sec-count" id="sec-count">–</span></div>
    </div>
    <div id="content"></div>
  </div>
</main>

// ── VENUE CONFIG ──
const VENUES = [
  {key:'desa', label:'Desa Padel', color:'#a78bfa', dot:'#8b5cf6'},
  {key:'378',  label:'378',        color:'#fb923c', dot:'#f97316'},
  {key:'court',label:'Court',      color:'#4ade80', dot:'#22c55e'},
  {key:'orange',label:'Orange Garden',color:'#facc15',dot:'#eab308'},
  {key:'raxa', label:'Raxa',       color:'#f87171', dot:'#ef4444'},
  {key:'atlas',label:'Atlas',      color:'#38bdf8', dot:'#0ea5e9'},
  {key:'hive', label:'Hive',       color:'#fbbf24', dot:'#f59e0b'},
  {key:'verde',label:'Verde',      color:'#34d399', dot:'#10b981'},
  {key:'other',label:'Lainnya',    color:'#818cf8', dot:'#6366f1'},
];

function getVenue(v){
  const t = v.title.toLowerCase();
  if(t.includes('desa padel')||t.includes('desa')) return 'desa';
  if(t.includes('378')) return '378';
  if(t.includes('court')) return 'court';
  if(t.includes('orange garden')||t.includes('orange')) return 'orange';
  if(t.includes('raxa')) return 'raxa';
  if(t.includes('atlas')) return 'atlas';
  if(t.includes('hive')) return 'hive';
  if(t.includes('verde')) return 'verde';
  return 'other';
}

function durToSec(d){
  const p = d.split(':').map(Number);
  return p.length===3 ? p[0]*3600+p[1]*60+p[2] : p[0]*60+p[1];
}
function secToHM(s){
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60);
  return h>0 ? h+'j '+(m?m+'m':'') : m+'m';
}
function isShort(v){ return durToSec(v.dur) < 3600; }
function thumb(id){ return 'https://i.ytimg.com/vi/'+id+'/mqdefault.jpg'; }
function ytUrl(id){ return 'https://www.youtube.com/watch?v='+id; }

// ── STATE ──
let durFilter = 'all';
let activeVenue = '';
let activeView = 'grid';

// ── SIDEBAR VENUE LIST ──
function buildSidebar(){
  const counts = {};
  VIDEOS.forEach(v => { const ve=getVenue(v); counts[ve]=(counts[ve]||0)+1; });
  const el = document.getElementById('venue-list');
  const allCount = VIDEOS.length;
  el.innerHTML = `<div class="venue-item ${activeVenue===''?'on':''}" onclick="setVenue('')">
    <div class="vdot" style="background:#6366f1"></div>
    <span>Semua</span>
    <span class="venue-count">${allCount}</span>
  </div>` + VENUES.filter(v=>counts[v.key]).map(v=>`
    <div class="venue-item ${activeVenue===v.key?'on':''}" onclick="setVenue('${v.key}')">
      <div class="vdot" style="background:${v.dot}"></div>
      <span>${v.label}</span>
      <span class="venue-count">${counts[v.key]||0}</span>
    </div>`).join('');
}

// ── FILTERS ──
function setVenue(v){ activeVenue=v; buildSidebar(); render(); }
function setDur(d){
  durFilter=d;
  ['all','full','short'].forEach(x=>document.getElementById('p-'+x).classList.toggle('on',x===d));
  render();
}
function setView(v, el){
  activeView=v;
  document.querySelectorAll('nav a').forEach(a=>a.classList.remove('on'));
  if(el) el.classList.add('on');
  render();
}

function getFiltered(){
  const q = document.getElementById('q').value.toLowerCase().trim();
  const mon = document.getElementById('sel-month').value;
  return VIDEOS.filter(v=>{
    if(q && !v.title.toLowerCase().includes(q) && !v.date.includes(q)) return false;
    if(mon && !v.date.startsWith(mon)) return false;
    if(activeVenue && getVenue(v)!==activeVenue) return false;
    if(durFilter==='full' && isShort(v)) return false;
    if(durFilter==='short' && !isShort(v)) return false;
    return true;
  });
}

// -- VIDEO MODAL --
function openModal(id, title){
  document.getElementById('modal-iframe').src = 'https://www.youtube.com/embed/'+id+'?autoplay=1&rel=0';
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-yt').href = 'https://www.youtube.com/watch?v='+id;
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(e){
  if(e && e.target !== document.getElementById('modal') && !e.target.classList.contains('modal-close')) return;
  document.getElementById('modal').classList.remove('open');
  document.getElementById('modal-iframe').src='';
  document.body.style.overflow='';
}
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeModal({target:document.getElementById('modal')}); });

// -- CARD HTML --
function cardHtml(v, mini=false){
  const ve = getVenue(v), vcfg = VENUES.find(x=>x.key===ve)||VENUES[VENUES.length-1];
  const short = isShort(v);
  const safeTitle = v.title.replace(/'/g,"&#39;");
  if(mini) return `<div class="mini-card" onclick="openModal('${v.id}','${safeTitle}')" style="cursor:pointer">
    <div class="mini-thumb"><img src="${thumb(v.id)}" loading="lazy"><div class="mini-dur">${v.dur}</div></div>
    <div class="mini-body"><div class="mini-title">${v.title}</div></div>
  </div>`;
  return `<div class="card" onclick="openModal('${v.id}','${safeTitle}')" style="cursor:pointer">
    <div class="thumb">
      <img src="${thumb(v.id)}" loading="lazy">
      <div class="play-overlay"><div class="play-circle"><svg viewBox="0 0 16 16"><polygon points="3,1 15,8 3,15"/></svg></div></div>
      <div class="dur-badge">${v.dur}</div>
      ${short?'<div class="short-tag">CLIP</div>':''}
    </div>
    <div class="card-body">
      <div class="vtag v-${ve}">${vcfg.label}</div>
      <div class="card-title">${v.title}</div>
      <div class="card-meta"><span class="card-date">${v.date}</span></div>
    </div>
  </div>`;
}

// ── STATS ──
function updateStats(vids){
  const totalSec = vids.reduce((a,v)=>a+durToSec(v.dur),0);
  const dates = [...new Set(vids.map(v=>v.date))];
  const venues = [...new Set(vids.map(getVenue))];
  const avgSec = dates.length ? totalSec/dates.length : 0;
  document.getElementById('s-total').textContent = vids.length;
  document.getElementById('s-dur').textContent = secToHM(totalSec);
  document.getElementById('s-sesi').textContent = dates.length;
  document.getElementById('s-avg').textContent = secToHM(avgSec);
  document.getElementById('s-venue').textContent = venues.length;
}

// ── RENDER ──
function render(){
  const vids = getFiltered();
  updateStats(vids);
  document.getElementById('sec-count').textContent = vids.length + ' video';
  const content = document.getElementById('content');
  if(!vids.length){
    content.innerHTML = '<div class="empty"><div class="emoji">🔍</div><p>Tidak ada video yang cocok.</p></div>';
    return;
  }
  if(activeView==='grid'){
    document.getElementById('sec-title').childNodes[0].textContent = 'Video ';
    content.innerHTML = '<div class="vid-grid">'+vids.map(v=>cardHtml(v)).join('')+'</div>';
  } else if(activeView==='timeline'){
    document.getElementById('sec-title').childNodes[0].textContent = 'Timeline ';
    const byDate = {};
    vids.forEach(v=>{ if(!byDate[v.date]) byDate[v.date]=[]; byDate[v.date].push(v); });
    content.innerHTML = '<div class="timeline">'+Object.entries(byDate).map(([date,dvids])=>{
      const totalSec = dvids.reduce((a,v)=>a+durToSec(v.dur),0);
      return `<div class="sesi-block">
        <div class="sesi-hdr">
          <div class="sesi-hdr-left">
            <div class="sesi-hdr-date">${date}</div>
            <div class="sesi-hdr-meta">${dvids.length} video · ${secToHM(totalSec)}</div>
          </div>
        </div>
        <div class="sesi-vids">${dvids.map(v=>cardHtml(v,true)).join('')}</div>
      </div>`;
    }).join('')+'</div>';
  } else {
    // stats view
    const venues = {};
    vids.forEach(v=>{ const ve=getVenue(v); if(!venues[ve]) venues[ve]={count:0,sec:0}; venues[ve].count++; venues[ve].sec+=durToSec(v.dur); });
    content.innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px">'+
      Object.entries(venues).map(([ve,d])=>{
        const vcfg = VENUES.find(x=>x.key===ve)||VENUES[VENUES.length-1];
        return `<div class="stat-card"><div class="val" style="color:${vcfg.color}">${d.count}</div><div class="lbl">${vcfg.label}</div><div style="font-size:11px;color:var(--text3);margin-top:4px;font-family:'Space Mono',monospace">${secToHM(d.sec)}</div></div>`;
      }).join('')+'</div>';
  }
}

// ── INIT ──
buildSidebar();
render();

// ── MOBILE SIDEBAR ──
function openSidebar(){
  document.querySelector('aside').classList.add('open');
  document.getElementById('sidebar-overlay').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeSidebar(){
  document.querySelector('aside').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('open');
  document.body.style.overflow='';
}
// close sidebar when a venue/nav item is tapped on mobile
document.querySelectorAll('nav a').forEach(a=>a.addEventListener('click',()=>{
  if(window.innerWidth<=768) closeSidebar();
}));
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('venue-list').addEventListener('click',()=>{
    if(window.innerWidth<=768) closeSidebar();
  });
});
</script>
